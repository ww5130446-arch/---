let seed=42;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}let buildings=[],trees=[],npcs=[];for(let i=0;i<90;i++){let x=(rnd()-.5)*120,z=(rnd()-.5)*120;if(Math.hypot(x,z)<12)continue;let w=2+rnd()*4,d=2+rnd()*4,h=2+rnd()*7;buildings.push({x,z,w,d,h,c:[.22+.2*rnd(),.25+.2*rnd(),.32+.2*rnd(),1]})}for(let i=0;i<180;i++){let x=(rnd()-.5)*150,z=(rnd()-.5)*150;if(Math.hypot(x,z)<9)continue;trees.push({x,z,h:1.5+rnd()*2})}for(let i=0;i<28;i++)npcs.push({x:(rnd()-.5)*90,z:(rnd()-.5)*90,a:rnd()*6.28,t:rnd()*8});
